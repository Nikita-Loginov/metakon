<div class="arrows-swiper">
  <button
    class="button button--cub button--cub--small button--white arrows-swiper__arrow prev"
    type="button"
    style="rotate: -180deg"
  >
    <span class="icon">
      <svg>
        <use xlink:href="#arrow-line-right-icon"></use>
      </svg>
    </span>
  </button>

  <button
    class="button button--cub button--cub--small button--white arrows-swiper__arrow next"
    type="button"
  >
    <span class="icon">
      <svg>
        <use xlink:href="#arrow-line-right-icon"></use>
      </svg>
    </span>
  </button>
</div>
